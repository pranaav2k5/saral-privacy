openapi: 3.1.0
info:
  title: Saral Privacy API
  version: 0.1.0
  summary: Consent capture, signed receipts, and the audit log.
  description: |
    Authentication: send an API key, or a staff session token from `/v1/auth/mfa/verify`, as `Authorization: Bearer <...>`. A publishable key (`pk_...`, scope `sdk`) is safe
    to ship in a browser and may be restricted to origins. A secret key (`sk_...`) carries one or more of the scopes
    `tenant_admin`, `dpo` and `auditor` and must stay on a server. Every request is limited to the key's tenant.

    Failures to authenticate all return the same 401 body. A request for another tenant's data returns 404, never 403.

    Browsers may call the API: CORS reflects the caller's origin and never allows cookies. This is not authorisation;
    the key, its scopes and its origin list are checked on every request.

    Rate limits are not built yet.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Consents
  - name: Notices
  - name: Audit
  - name: Keys
  - name: Webhooks
  - name: Rights requests
  - name: Staff sign-in
  - name: Operations
paths:
  /healthz:
    get:
      tags: [Operations]
      operationId: health
      summary: Liveness
      x-access: public
      responses:
        "200":
          description: The process is up. This does not check the database.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /.well-known/jwks.json:
    get:
      tags: [Keys]
      operationId: jwks
      summary: Public keys that verify consent receipts
      x-access: public
      responses:
        "200":
          description: A JSON Web Key Set with public members only. May be cached for 5 minutes.
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=300" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Jwks" }
  /v1/notices:
    post:
      tags: [Notices]
      operationId: publishNotice
      summary: Publish a new version of the organisation's privacy notice
      description: >-
        The text is made from the reviewed template for the language, filled with the values given here. It is never taken
        from the caller, and it is marked `pending-human-review`. Every publication is a new version of its language
        (the first is version 1, and each language is numbered on its own). A published notice never changes, so an
        edit is a new notice, and receipts keep pointing to the text the person saw. Each purpose carries both its
        notice wording (`name`, `description`, `dataItems`, `retention`) and what receipts say about it (`key`,
        `retentionDays`, categories, third-party disclosure). A purpose that discloses to a third party must name an
        organisation that is listed in `notice.thirdParties`. Fields that are not part of the request are refused, so
        a misspelt field is not silently ignored. Publishing is an audit event (`notice.published`). The response has
        no text; read it at `GET /v1/notices/{id}`.
      x-scopes: [tenant_admin]
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishNotice" }
      responses:
        "201":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeSummary" }
        "400":
          description: >-
            Invalid. `field` names the first problem by its place in the request, for example `notice.withdrawalUrl` or
            `purposes[1].retentionDays`. When there are several problems with the notice text, `errors` lists them all.
            Nothing submitted is echoed back.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Notices]
      operationId: listNotices
      summary: The organisation's published notices, newest first
      description: Without the text, which is public at `GET /v1/notices/{id}`. Use it to find the id of a notice to give the SDK.
      x-scopes: [tenant_admin]
      security: [{ apiKey: [] }]
      responses:
        "200":
          description: The notices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoticeSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/notices/{id}:
    get:
      tags: [Notices]
      operationId: getNotice
      summary: A published privacy notice
      description: Public by design. The URL is what a receipt points to.
      x-access: public
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: The notice text exactly as hashed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/consents:
    post:
      tags: [Consents]
      operationId: grantConsent
      summary: Record a consent and get a signed receipt
      description: |
        Retention and receipt details come from the notice's purpose definitions, never from the request. At least one
        purpose must be granted. The person is identified by a phone number or email address that is turned into a
        keyed HMAC and then discarded; it is never stored or logged.
      x-scopes: [sdk]
      security: [{ apiKey: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            A random, unguessable token (8 to 128 letters, digits, dashes or underscores) that the caller keeps for this
            request. Without it every request is a new consent, and the API never recognises a person by identifier alone,
            because that would hand a stored receipt to anyone who knows the identifier.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "200":
          description: >-
            A retry: the request carries an `Idempotency-Key` that was already used for this same request, and the first result
            is returned unchanged. Nothing is recorded again, so a lost response is safe to retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantResponse" }
        "201":
          description: >-
            Recorded. `receipt` is a Kantara KI-CR-v1.1.0 receipt as an RS256 JWT. Its `policyUrl` is the public notice URL
            (when the server has a public base URL), and the extension claims `saralConsentId`, `saralNoticeId` and
            `saralNoticeSha256` say which consent and which exact notice text it covers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The `Idempotency-Key` was already used for a different request, or its consent is no longer granted. Use a new key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/consents/withdraw:
    post:
      tags: [Consents]
      operationId: withdrawAllConsents
      summary: Withdraw every consent a person has, by identifier alone (secret keys only)
      description: >-
        For a tenant's server, after it has verified the person itself (a signed-in user, a support request). The identifier
        alone proves nothing about who is calling, and a publishable key is visible in a web page, so **a publishable key gets
        403**. Withdraws every granted consent of the person in the tenant, optionally only for one notice. Each withdrawal is
        audited and queued as an event. A wrong identifier, another tenant's person, and nothing left to withdraw are all the
        same 404. The browser SDK withdraws by consent id and identifier instead (`/v1/consents/{id}/withdraw`).
      x-scopes: [sdk]
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { $ref: "#/components/schemas/Identifier" }
                noticeId: { type: string, format: uuid }
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema:
                type: object
                required: [status, consentIds, withdrawnAt]
                properties:
                  status: { const: withdrawn }
                  consentIds:
                    type: array
                    items: { type: string, format: uuid }
                  withdrawnAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/consents/{id}/withdraw:
    post:
      tags: [Consents]
      operationId: withdrawConsent
      summary: Withdraw a consent
      description: The caller proves who they are with the same identifier. A wrong identifier looks the same as an unknown consent (404).
      x-scopes: [sdk]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { $ref: "#/components/schemas/Identifier" }
      responses:
        "200":
          description: Withdrawn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The consent is already withdrawn or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/consents/{id}/receipt:
    get:
      tags: [Consents]
      operationId: getReceipt
      summary: The receipt of a consent
      x-scopes: [tenant_admin]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: The receipt issued when the consent was recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantResponseWithoutStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/webhook-endpoints:
    post:
      tags: [Webhooks]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: >-
        The URL must be https on the standard port, with no credentials, and every address its host name resolves to
        must be public (private, loopback, link-local and reserved addresses are refused, and checked again at every
        delivery). A tenant may have at most 10 active endpoints (disable one to free a place). The signing secret is shown only in this response; `rotate-secret` issues a new one.
        Creating an endpoint is an audit event.
      x-scopes: [tenant_admin]
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri, maxLength: 500 }
                events:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointWithSecret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The tenant already has 10 active endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [Webhooks]
      operationId: listWebhookEndpoints
      summary: List the tenant's webhook endpoints
      x-scopes: [tenant_admin]
      security: [{ apiKey: [] }]
      responses:
        "200":
          description: Endpoints, without secrets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/webhook-endpoints/{id}:
    delete:
      tags: [Webhooks]
      operationId: disableWebhookEndpoint
      summary: Disable a webhook endpoint
      description: >-
        Nothing more is sent to it and its place in the cap of 10 is free again. Events still waiting for it are
        marked failed. Disabling is an audit event. An endpoint cannot be enabled again; register a new one.
      x-scopes: [tenant_admin]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204":
          description: Disabled.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/webhook-endpoints/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Issue a new signing secret
      description: >-
        The new secret is shown only in this response. The old one stops working at once: later deliveries are signed
        with the new secret. Rotating is an audit event. A disabled endpoint cannot be rotated.
      x-scopes: [tenant_admin]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema:
                type: object
                required: [id, secret]
                properties:
                  id: { type: string, format: uuid }
                  secret: { type: string, pattern: '^whsec_[A-Za-z0-9_-]{43}$' }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/dsr:
    post:
      tags: [Rights requests]
      operationId: submitRightsRequest
      summary: A person asks for access, correction, erasure, nomination, or to complain
      description: >-
        The answer is the same whether or not the person is already known, so it cannot be used to find out who is a
        customer. The person's phone number or email address is kept only sealed (AES-256-GCM) so the data protection
        officer can answer; it is never in audit entries or webhooks. The request is due 30 days after it is submitted (a
        working default, not yet confirmed against the Rules). Submitting is an audit event and queues `dsr.submitted`.
      x-scopes: [sdk]
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, identifier]
              properties:
                type: { $ref: "#/components/schemas/RightsType" }
                identifier: { $ref: "#/components/schemas/Identifier" }
                details: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Submitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RightsRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Rights requests]
      operationId: listRightsRequests
      summary: The data protection officer's queue
      description: Soonest due first, with the details the person wrote. `overdue` lists open requests past their due date.
      x-scopes: [dpo]
      security: [{ apiKey: [] }]
      parameters:
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/RightsState" } }
        - { name: overdue, in: query, required: false, schema: { type: boolean } }
      responses:
        "200":
          description: Requests of the tenant.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RightsRequestWithDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/dsr/{id}:
    get:
      tags: [Rights requests]
      operationId: getRightsRequest
      summary: One rights request
      x-scopes: [dpo]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RightsRequestWithDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/dsr/{id}/transition:
    post:
      tags: [Rights requests]
      operationId: transitionRightsRequest
      summary: Move a request to its next state
      description: >-
        Legal moves: submitted to identity_pending, in_review or rejected; identity_pending to in_review or rejected;
        in_review to fulfilled or rejected; fulfilled or rejected to closed. A rejection needs a reason. Fulfilling an
        **erasure** request, in the same transaction, withdraws the person's consents, deletes the sealed contact, and
        replaces their pseudonym so their identifier no longer leads to them; the audit chain stays intact. Every move is
        an audit event and queues `dsr.transitioned`. Whether this erasure design satisfies the Act is a question for the
        lawyer advisor.
      x-scopes: [dpo]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/RightsState" }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RightsRequestWithDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: That move is not allowed from the current state. `allowed` lists the moves that are.
          content:
            application/json:
              schema:
                type: object
                required: [error, from, to, allowed, message]
                properties:
                  error: { const: illegal_transition }
                  from: { $ref: "#/components/schemas/RightsState" }
                  to: { $ref: "#/components/schemas/RightsState" }
                  allowed:
                    type: array
                    items: { $ref: "#/components/schemas/RightsState" }
                  message: { type: string }
  /v1/dsr/{id}/reveal-contact:
    post:
      tags: [Rights requests]
      operationId: revealRightsContact
      summary: Show the person's phone number or email address to the data protection officer
      description: Every read is an audit event (`dsr.contact_revealed`) that names the key that read it. 410 after the contact was erased.
      x-scopes: [dpo]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                type: object
                required: [contact]
                properties:
                  contact: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The contact was erased or was never captured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/login:
    post:
      tags: [Staff sign-in]
      operationId: staffLogin
      summary: "Step one of signing in: the password"
      description: >-
        Returns a short-lived (5 minute) **challenge**, never a session. `mfa` says whether the person must set up an
        authenticator (`enroll`) or has one (`verify`). An unknown organisation, an unknown email, a wrong password, a
        disabled person and a locked account all give exactly the same 401, and take about the same time. Five wrong passwords
        or codes lock the account for 15 minutes (and that is an audit event). Staff accounts are created by operators.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, email, password]
              properties:
                tenant:
                  type: string
                  description: "The organisation's short name (its slug)."
                  pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
                email: { type: string }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Password accepted.
          content:
            application/json:
              schema:
                type: object
                required: [challenge, mfa]
                properties:
                  challenge: { type: string }
                  mfa: { enum: [enroll, verify] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/mfa/enroll:
    post:
      tags: [Staff sign-in]
      operationId: staffEnrollMfa
      summary: "First time only: a new authenticator secret to scan"
      description: The secret is not trusted until a code from it is accepted by `mfa/verify`. 409 if an authenticator is already set up.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge]
              properties:
                challenge: { type: string }
      responses:
        "200":
          description: The secret, and the link an authenticator app scans as a QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl]
                properties:
                  secret: { type: string, description: Base32. }
                  otpauthUrl: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: An authenticator is already set up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/mfa/verify:
    post:
      tags: [Staff sign-in]
      operationId: staffVerifyMfa
      summary: "Step two of signing in: the authenticator code or a recovery code"
      description: >-
        A six-digit authenticator code (one step of clock drift allowed; a code works once), or a recovery code such as
        `abcde-fghij` (once). The first successful code confirms the authenticator and returns eight **recovery codes, shown
        only this once**. The session lasts 15 minutes and can be refreshed until eight hours after this sign-in.
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The authenticator has not been set up yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/refresh:
    post:
      tags: [Staff sign-in]
      operationId: staffRefresh
      summary: A new session for a still-valid one
      description: Sessions only (an API key gets 403). Refuses once eight hours have passed since the person last signed in with a password and a code.
      x-scopes: [tenant_admin, dpo]
      security: [{ apiKey: [] }]
      responses:
        "200":
          description: A new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/auth/me:
    get:
      tags: [Staff sign-in]
      operationId: staffMe
      summary: Who is signed in and what they may do
      x-scopes: [tenant_admin, dpo]
      security: [{ apiKey: [] }]
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                required: [staffId, tenantId, scopes]
                properties:
                  staffId: { type: string, format: uuid }
                  email: { type: [string, "null"] }
                  role: { enum: [tenant_admin, dpo, null] }
                  tenantId: { type: string, format: uuid }
                  scopes:
                    type: array
                    items: { enum: [sdk, tenant_admin, dpo, auditor] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/audit/verify:
    get:
      tags: [Audit]
      operationId: verifyAudit
      summary: Recompute the tenant's audit hash chain
      description: >-
        Verifies the whole chain, or one UTC day when `date` is given. When the chain does not verify the result has
        `ok` set to false and names the first failing entry. A chain that does not verify is not an HTTP error.
      x-scopes: [auditor]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Date" }
      responses:
        "200":
          description: The verification result.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/VerifyOk" }
                  - { $ref: "#/components/schemas/VerifyFailed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/TooLarge" }
  /v1/audit/merkle-root:
    get:
      tags: [Audit]
      operationId: getAnchor
      summary: The anchor for one UTC day
      x-scopes: [auditor]
      security: [{ apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Date" }
      responses:
        "200":
          description: Count, head hash and Merkle root of the day's entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anchor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The day's chain does not verify, so no anchor is given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/TooLarge" }
webhooks:
  consentEvent:
    post:
      tags: [Webhooks]
      operationId: receiveConsentEvent
      summary: An event Saral sends to a registered endpoint
      description: |
        Delivery is at least once. Answer with any 2xx within 10 seconds; anything else (including a redirect, which is
        not followed) is retried with exponential backoff and jitter, from about 10 seconds up to 6 hours between tries,
        15 attempts in all. De-duplicate with the `Idempotency-Key` header, which is the delivery id.

        Verify `X-Saral-Signature` (`t=<unix seconds>,v1=<hex>`): the value is the HMAC-SHA256, keyed with the endpoint's
        signing secret (the bytes after `whsec_`, base64url), of the string `<t>.<raw request body>`. Reject the request if
        `t` is more than 5 minutes from your clock. The header may carry several `v1` values during a secret rotation;
        accept the request if any one matches. Payloads hold ids and states only, never a phone number or email.
      parameters:
        - { name: X-Saral-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Saral-Event, in: header, required: true, schema: { $ref: "#/components/schemas/WebhookEvent" } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookDelivery" }
      responses:
        "200":
          description: Received.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A publishable (`pk_...`) or secret (`sk_...`) API key.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Date:
      name: date
      in: query
      required: false
      description: A UTC calendar day, YYYY-MM-DD.
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
  responses:
    BadRequest:
      description: The request is malformed. `field` names the problem.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, unknown, wrong or revoked key. Always the same body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The key is valid but lacks the scope, or is used from an origin it is not allowed from.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or belongs to another tenant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The request would read more than the limit (100,000 entries). Verify one UTC day at a time with `date`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: The notice does not define a purpose, nothing was granted, or the tenant profile is incomplete.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        error: { type: string }
        message: { type: string }
        field: { type: string }
        errors:
          type: array
          description: Every problem, when there are several (publishing a notice).
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    WebhookEvent:
      enum: [consent.granted, consent.withdrawn, dsr.submitted, dsr.transitioned]
    WebhookEndpoint:
      type: object
      required: [id, url, events, createdAt, disabledAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEvent" }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: [string, "null"], format: date-time }
    WebhookEndpointWithSecret:
      allOf:
        - { $ref: "#/components/schemas/WebhookEndpoint" }
        - type: object
          required: [secret]
          properties:
            secret: { type: string, pattern: '^whsec_[A-Za-z0-9_-]{43}$' }
    WebhookDelivery:
      type: object
      required: [id, type, createdAt, data]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/WebhookEvent" }
        createdAt: { type: string, format: date-time }
        data:
          type: object
          description: >-
            For consent.granted: consentId, receiptId, noticeId, principalId (pseudonymous), collectionMethod, status
            and purposes (key and granted). For consent.withdrawn: consentId, noticeId, principalId, status, withdrawnAt.
            For dsr.submitted: requestId, type, state, dueAt, principalId. For dsr.transitioned: requestId, type, from, state,
            dueAt. Never the person's text or contact.
    RightsType:
      enum: [access, correction, erasure, nomination, grievance]
    RightsState:
      enum: [submitted, identity_pending, in_review, fulfilled, rejected, closed]
    RightsRequest:
      type: object
      required: [id, type, state, submittedAt, dueAt, overdue, decidedReason, closedAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/RightsType" }
        state: { $ref: "#/components/schemas/RightsState" }
        submittedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        overdue: { type: boolean }
        decidedReason: { type: [string, "null"] }
        closedAt: { type: [string, "null"], format: date-time }
    RightsRequestWithDetails:
      allOf:
        - { $ref: "#/components/schemas/RightsRequest" }
        - type: object
          properties:
            details: { type: [string, "null"] }
    StaffSession:
      type: object
      required: [token, expiresAt, role]
      properties:
        token: { type: string, description: "A signed session token (starts with st_v1.). Send it as a bearer token." }
        expiresAt: { type: string, format: date-time }
        role: { enum: [tenant_admin, dpo] }
        recoveryCodes:
          type: array
          description: Only on the first sign-in, shown once.
          items: { type: string }
    Identifier:
      type: string
      description: An E.164 phone number (+919876543210) or an email address.
    GrantRequest:
      type: object
      required: [noticeId, identifier, purposes]
      properties:
        noticeId: { type: string, format: uuid }
        identifier: { $ref: "#/components/schemas/Identifier" }
        purposes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [key, granted]
            properties:
              key: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
              granted: { type: boolean }
    GrantResponse:
      type: object
      required: [consentId, receiptId, receipt, status]
      properties:
        consentId: { type: string, format: uuid }
        receiptId: { type: string, format: uuid }
        receipt: { type: string, description: A compact JWS (RS256). }
        status: { const: granted }
    GrantResponseWithoutStatus:
      type: object
      required: [consentId, receiptId, receipt]
      properties:
        consentId: { type: string, format: uuid }
        receiptId: { type: string, format: uuid }
        receipt: { type: string }
    WithdrawResponse:
      type: object
      required: [consentId, status, withdrawnAt]
      properties:
        consentId: { type: string, format: uuid }
        status: { const: withdrawn }
        withdrawnAt: { type: string, format: date-time }
    PublishNotice:
      type: object
      required: [language, notice, purposes]
      additionalProperties: false
      properties:
        language: { enum: [en, hi] }
        notice:
          type: object
          required: [organisationName, websiteUrl, grievanceEmail, grievanceAddress, processesChildrenData, withdrawalUrl, rightsRequestUrl]
          additionalProperties: false
          properties:
            organisationName: { type: string, maxLength: 200 }
            websiteUrl: { type: string, format: uri, maxLength: 500 }
            grievanceEmail: { type: string, format: email, maxLength: 254 }
            grievanceAddress: { type: string, maxLength: 300 }
            dpoName: { type: string, maxLength: 200 }
            thirdParties: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
            processesChildrenData: { type: boolean }
            withdrawalUrl: { type: string, format: uri, maxLength: 500, description: "https. Every receipt names it as the way to withdraw." }
            rightsRequestUrl: { type: string, format: uri, maxLength: 500 }
        purposes:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [key, name, description, dataItems, retention, retentionDays, purposeCategory, piiCategory, thirdPartyDisclosure]
            additionalProperties: false
            properties:
              key: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: "What the SDK sends. Unique in the notice." }
              name: { type: string, maxLength: 200 }
              description: { type: string, maxLength: 1000 }
              dataItems: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 100 } }
              retention: { type: string, maxLength: 200, description: "How long, in words, as the notice says it." }
              retentionDays: { type: integer, minimum: 0, maximum: 36500, description: "How long, in days, as receipts say it." }
              purposeCategory: { type: array, minItems: 1, maxItems: 10, items: { type: string, maxLength: 100 } }
              piiCategory: { type: array, minItems: 1, maxItems: 10, items: { type: string, maxLength: 100 } }
              thirdPartyDisclosure: { type: boolean }
              thirdPartyName: { type: string, description: "Required, and listed in notice.thirdParties, when thirdPartyDisclosure is true. Not allowed otherwise." }
              primaryPurpose: { type: boolean }
    NoticeSummary:
      type: object
      required: [id, version, language, reviewStatus, canonicalSha256, publishedAt, purposeKeys]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        language: { type: string }
        reviewStatus: { enum: [pending-human-review, reviewed] }
        canonicalSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        publishedAt: { type: string, format: date-time }
        purposeKeys: { type: array, items: { type: string } }
    Notice:
      type: object
      required: [id, version, language, canonicalText, canonicalSha256, reviewStatus, publishedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        language: { type: string }
        canonicalText: { type: string }
        canonicalSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        reviewStatus: { enum: [pending-human-review, reviewed] }
        publishedAt: { type: string, format: date-time }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, n, e, kid, alg, use]
            properties:
              kty: { const: RSA }
              n: { type: string }
              e: { type: string }
              kid: { type: string }
              alg: { const: RS256 }
              use: { const: sig }
    VerifyOk:
      type: object
      required: [ok, count, headHash, firstSeqNo, lastSeqNo, merkleRoot]
      properties:
        ok: { const: true }
        count: { type: integer }
        headHash: { type: string }
        firstSeqNo: { type: [string, "null"] }
        lastSeqNo: { type: [string, "null"] }
        merkleRoot: { type: string }
    VerifyFailed:
      type: object
      required: [ok, failure, seqNo]
      properties:
        ok: { const: false }
        failure:
          enum: [hash_mismatch, prev_mismatch, seq_gap, unknown_key, key_version_regression, unsupported_version, invalid_fields, tenant_mismatch]
        seqNo: { type: string }
    Anchor:
      type: object
      required: [version, tenantId, date, count, firstSeqNo, lastSeqNo, headHash, merkleRoot]
      properties:
        version: { const: 1 }
        tenantId: { type: string, format: uuid }
        date: { type: string }
        count: { type: integer }
        firstSeqNo: { type: string }
        lastSeqNo: { type: string }
        headHash: { type: string }
        merkleRoot: { type: string }
